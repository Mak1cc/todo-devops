---
- name: Deploy ToDo DevOps application
  hosts: webservers
  become: yes

  tasks:
    - name: Update apt package index
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Run ToDo application container
      docker_container:
        name: todo-devops-web
        image: todo-devops-app:latest
        state: started
        ports:
          - "5000:5000"