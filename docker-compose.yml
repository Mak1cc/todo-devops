services:
  web:
    build: .
    container_name: todo-devops-web
    ports:
      - "5000:5000"
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: todo-devops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - web
    restart: always